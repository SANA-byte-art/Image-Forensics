{% extends "base.html" %}

{% block title %}Image Detection{% endblock %}

{% block content %}

<div class="detect-container">

    <h1>AI Image Detection Scanner</h1>

    <!-- Blurred scanner preview -->
    <div class="scanner-preview">

        <div class="scanner-box">
            <p>Upload Image</p>
            <button disabled>Choose File</button>
            <button disabled>Analyze Image</button>
        </div>

        <div class="scan-animation"></div>

    </div>

</div>


<!-- LOGIN POPUP -->
<div class="login-popup">

    <div class="popup-box">

        <h2>🔒 Login Required</h2>

        <p>
        Please login or register to use the
        FORENSIX AI Image Detection system.
        </p>

        <div class="popup-buttons">
            <a href="/login" class="popup-btn">Login</a>
            <a href="/register" class="popup-btn">Register</a>
        </div>

    </div>

</div>


<style>

/* Container */
.detect-container{
    text-align:center;
    margin-top:40px;
}

/* Scanner Preview */

.scanner-preview{
    margin-top:40px;
    filter: blur(4px);
    opacity:0.6;
}

/* Scanner Box */

.scanner-box{
    border:2px dashed #555;
    padding:40px;
    width:400px;
    margin:auto;
    border-radius:10px;
}

/* Fake scan animation */

.scan-animation{
    width:400px;
    height:4px;
    background:red;
    margin:30px auto;
    animation:scan 2s infinite;
}

@keyframes scan{
    0%{transform:translateY(-20px)}
    50%{transform:translateY(20px)}
    100%{transform:translateY(-20px)}
}

/* LOGIN POPUP */

.login-popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    display:flex;
    justify-content:center;
    align-items:center;
}

.popup-box{
    background:#111;
    padding:40px;
    border-radius:10px;
    text-align:center;
}

.popup-box h2{
    color:#ff4c4c;
}

.popup-btn{
    display:inline-block;
    margin:10px;
    padding:10px 20px;
    background:#6c5ce7;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.popup-btn:hover{
    background:#4834d4;
}

</style>

{% endblock %}
